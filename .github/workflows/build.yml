name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  GEODE_VERSION: 5.8.2
  MOD_ID: geekedgdplayer.click-guide-visualizer

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64
            artifact: build-windows
          - name: macOS
            os: macos-latest
            target: MacOS
            artifact: build-macos
          - name: iOS
            os: macos-latest
            target: iOS
            artifact: build-ios
          - name: Android arm64-v8a
            os: ubuntu-latest
            target: Android64
            artifact: build-android64
          - name: Android armeabi-v7a
            os: ubuntu-latest
            target: Android32
            artifact: build-android32

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}
          sdk: v${{ env.GEODE_VERSION }}
          build-config: Release

  package:
    name: Combine into one .geode
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Merge every platform binary
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload the packaged mod
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MOD_ID }}
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error

  verify:
    name: Verify the package
    runs-on: ubuntu-latest
    needs: package

    steps:
      - name: Download the packaged mod
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.MOD_ID }}
          path: packaged

      - name: Unpack and inspect
        run: |
          set -euo pipefail
          cd packaged
          GEODE_FILE="$(find . -name '*.geode' | head -n 1)"
          test -n "$GEODE_FILE" || { echo "::error::no .geode produced"; exit 1; }

          echo "Package: $GEODE_FILE"
          ls -lh "$GEODE_FILE"

          mkdir -p unpacked
          unzip -q "$GEODE_FILE" -d unpacked
          cd unpacked
          ls -la

      - name: Reject oversized binaries
        run: |
          set -euo pipefail
          cd packaged/unpacked

          # An unstripped debug build is roughly 20x the size of a release
          # build and is rejected by the Android and iOS loaders.
          LIMIT_BYTES=$((12 * 1024 * 1024))
          FAILED=0

          for binary in *.so *.dylib *.dll; do
            [ -e "$binary" ] || continue
            SIZE="$(stat -c%s "$binary")"
            printf '%-46s %8s KB\n' "$binary" "$((SIZE / 1024))"
            if [ "$SIZE" -gt "$LIMIT_BYTES" ]; then
              echo "::error::$binary is $((SIZE / 1048576)) MB - debug symbols were not stripped"
              FAILED=1
            fi
          done

          exit "$FAILED"

      - name: Require an entry point in every native binary
        run: |
          set -euo pipefail
          cd packaged/unpacked
          FAILED=0

          for binary in *.so; do
            [ -e "$binary" ] || continue
            if readelf --dyn-syms "$binary" | grep -q geodeImplicitEntry; then
              echo "ok   $binary exports geodeImplicitEntry"
            else
              echo "::error::$binary does not export geodeImplicitEntry"
              FAILED=1
            fi
          done

          for binary in *.dll *.dylib; do
            [ -e "$binary" ] || continue
            if grep -qa geodeImplicitEntry "$binary"; then
              echo "ok   $binary exports geodeImplicitEntry"
            else
              echo "::error::$binary does not export geodeImplicitEntry"
              FAILED=1
            fi
          done

          exit "$FAILED"

      - name: Confirm the archive is not truncated
        run: |
          set -euo pipefail
          cd packaged
          GEODE_FILE="$(find . -name '*.geode' | head -n 1)"

          # "Cannot find EOCD" means the zip index is missing, which is what a
          # partial upload or a text-mode copy produces.
          unzip -t "$GEODE_FILE" > /dev/null
          python3 - "$GEODE_FILE" <<'PYEOF'
          import sys

          data = open(sys.argv[1], 'rb').read()
          if data[:2] != b'PK':
              raise SystemExit('::error::not a zip archive')
          if data.rfind(b'PK\x05\x06') < 0:
              raise SystemExit('::error::end of central directory record missing')
          print('archive intact,', len(data), 'bytes')
          PYEOF

      - name: Confirm the logo, about page and changelog are packaged
        run: |
          set -euo pipefail
          cd packaged/unpacked
          FAILED=0

          if [ -f logo.png ]; then
            python3 - <<'PYEOF'
          import struct

          data = open('logo.png', 'rb').read()
          if data[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('::error::logo.png is not a PNG')
          width, height = struct.unpack('>II', data[16:24])
          print(f'logo.png is {width}x{height}')
          if width != height:
              raise SystemExit(f'::error::logo.png must be square, got {width}x{height}')
          if width != 336:
              print(f'::warning::logo.png is {width}px, Geode expects 336px')
          PYEOF
          else
            echo "::error::logo.png missing from the package"
            FAILED=1
          fi

          if [ -f about.md ]; then
            echo "ok   about.md present, $(wc -l < about.md) lines"
          else
            echo "::error::about.md missing from the package"
            FAILED=1
          fi

          if [ -f changelog.md ]; then
            echo "ok   changelog.md present, $(wc -l < changelog.md) lines"
          else
            echo "::error::changelog.md missing from the package"
            FAILED=1
          fi

          exit "$FAILED"

      - name: Check the settings survived packaging
        run: |
          set -euo pipefail
          cd packaged/unpacked
          python3 - <<'PYEOF'
          import json

          metadata = json.load(open('mod.json'))
          settings = metadata['settings']

          required = [
              'rhythm-mode',
              'assist-buffer-input',
              'generate-from-level',
              'enable-cheats',
              'line-lead-units',
              'macro-file',
              'auto-align',
          ]

          deprecated = ['macro-path']
          present = [key for key in deprecated if key in settings]
          if present:
              raise SystemExit(f'::error::deprecated settings still present: {present}')

          missing = [key for key in required if key not in settings]
          if missing:
              raise SystemExit(f'::error::settings missing from package: {missing}')

          platforms = metadata['gd']
          print('id       ', metadata['id'])
          print('geode    ', metadata['geode'])
          print('platforms', platforms)
          print('settings ', len(settings))
          PYEOF

  release:
    name: Publish a release
    runs-on: ubuntu-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download the packaged mod
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.MOD_ID }}
          path: packaged

      - name: Attach it to the release
        uses: softprops/action-gh-release@v2
        with:
          files: packaged/*.geode
          generate_release_notes: true
          fail_on_unmatched_files: true
